<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/scripts.js' %}"></script>

    <!-- partie titre de l'onglet du navigateur -->
    <title>
        Skills Exchange
    </title>
    <!-- partie titre de l'onglet du navigateur -->
</head>
<body>

<!-- La partie block Header -->
    <main>
        <!-- Le titre dans la page -->
        <h1>
            Skills Exchange
        </h1>
        <!-- Fin titre dans la page -->

        <!-- La partie block Main -->
            <div style="display: flex; justify-content: center; align-items: center; height: 70vh;">
                <div class="welcome-card" style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: center; width: 350px;">
                    <h1 style="color: #333; margin-bottom: 20px; font-size: 1.5rem;">Welcome</h1>
                    <p style="color: #666; margin-bottom: 25px;">Please select a section :</p>

                    <!-- Link to skills_exchange App-->
                    <a href="{% url 'skills_exchange:index' %}" class="btn" style="display: block; width: 100%; padding: 12px; margin: 10px 0; text-decoration: none; color: white; background-color: #007bff; border-radius: 4px; font-weight: bold; box-sizing: border-box;">
                        Accéder aux Sondages (Polls)
                    </a>

                    <!-- Link to Django administration -->
                    <a href="{% url 'admin:index' %}" class="btn" style="display: block; width: 100%; padding: 12px; margin: 10px 0; text-decoration: none; color: white; background-color: #343a40; border-radius: 4px; font-weight: bold; box-sizing: border-box;">
                        Panneau d'Administration
                    </a>
                </div>
            </div>
        <!-- Fin partie block Main -->
    </main>



   <footer>
       </footer>
</body>
</html>
